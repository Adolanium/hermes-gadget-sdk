name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Firmware core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S firmware -B build/host -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/host --config Release --parallel
      - name: Test
        run: ctest --test-dir build/host -C Release --output-on-failure

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Build the simulator library
        run: hermes-gadget build-sim
      - name: Test
        # Tests that need a Hermes Agent checkout skip themselves here; hermes.yml runs them.
        run: pytest -q

  esp32:
    name: ESP32 firmware (${{ matrix.board }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [esp32s3-breadboard, esp32s3-touch-amoled-175, esp32s3-lcd-154]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('firmware/esp32/platformio.ini', 'firmware/esp32/main/idf_component.yml') }}
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build
        working-directory: firmware/esp32
        run: pio run -e ${{ matrix.board }}
