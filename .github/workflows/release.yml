name: Release

# Pushing a tag vX.Y.Z builds every board in platformio.ini and publishes the images,
# checksums and installer manifest as a GitHub release. PROJECT_VER in
# firmware/esp32/CMakeLists.txt must match the tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish again, e.g. v0.1.0"
        required: true

permissions:
  contents: write
  actions: write  # to start the installer site's deploy

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    name: CI passed on this commit
    # A tag is published only from a commit whose CI and Hermes runs already succeeded,
    # so a release never ships something main's checks have not seen.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Look up the runs for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          for workflow in ci.yml hermes.yml; do
            if gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --commit "$sha" --status success --limit 1 --json databaseId -q '.[0].databaseId' | grep -q .; then
              echo "$workflow succeeded on $sha"
            else
              echo "::error::$workflow has no successful run on $sha. Merge, wait for green CI on main, then tag that commit."
              exit 1
            fi
          done

  linux:
    name: Build Linux ARM64
    needs: verify
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - name: Build the native core and Python wheel
        run: |
          cmake -S firmware -B build/host -DCMAKE_BUILD_TYPE=Release
          cmake --build build/host --parallel
          ctest --test-dir build/host --output-on-failure
          python -m pip wheel --no-deps . --wheel-dir build/wheels
          python linux/package.py --library build/host/libhgsim.so --wheel build/wheels/hermes_gadget-*.whl
      - name: Test installation and updates on Debian Trixie
        run: |
          archive=$(find dist -name '*-linux-arm64.tar.gz')
          docker run --rm -v "$PWD:/source:ro" debian:trixie-slim sh /source/linux/test_install.sh "/source/$archive"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: linux-arm64
          path: dist/hermes-gadget-*-linux-arm64.tar.gz*
          if-no-files-found: error
  release:
    name: Build and publish
    needs: linux
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write  # to start the installer site's deploy
      id-token: write  # to sign the build provenance
      attestations: write  # to store it with the repository
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - name: Check the version and the changelog
        # The firmware, the Python package and the plugin must all carry the tag's version,
        # and CHANGELOG.md must have that version's section.
        run: python tools/check_versions.py --tag "$TAG"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('firmware/esp32/platformio.ini', 'firmware/esp32/main/idf_component.yml') }}
      - name: Install PlatformIO
        run: pip install platformio==6.2.0
      - name: Build every board
        working-directory: firmware/esp32
        run: pio run
      - name: Package
        working-directory: firmware/esp32
        run: >-
          python tools/package_release.py --all --out dist --expect-version "${TAG#v}"
          --notes "$RUNNER_TEMP/notes.md" --commit "$(git rev-parse HEAD)" --changelog ../../CHANGELOG.md
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: linux-arm64
          path: firmware/esp32/dist/
      - name: Attest build provenance
        # Signs a SLSA provenance record for every published file (firmware images, manifest,
        # checksums, Linux package), tying each to this workflow run and commit. Anyone can check
        # a download with: gh attestation verify <file> --repo Adolanium/hermes-gadget-sdk
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: firmware/esp32/dist/*
      - name: Publish
        working-directory: firmware/esp32
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Hermes Gadget ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md"
          fi
      - name: Update the installer site
        # A release published with this workflow's token starts no other workflow, so start the deploy.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
