name: Hermes

# The tests that need a real Hermes Agent: the adapter on Hermes's own classes and a full
# `hermes gateway run` end to end. Every push and pull request runs them against the pinned
# commit below; a daily run against Hermes main catches upstream changes that break the plugin.

on:
  push:
    branches: [main]
  pull_request:
    # A draft stays up for review. This job starts when the pull request is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:
    inputs:
      hermes_ref:
        description: Hermes Agent branch, tag or commit to test against (empty = the pinned commit)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: hermes-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Hermes Agent commit this SDK is verified against. To move it, run this workflow by hand
  # with hermes_ref: main; when it passes, put the commit it printed here and in plugin/compat.py.
  HERMES_REF: 2eceb0275501b09febdec88d08b80d1fff730cf8

jobs:
  integration:
    name: Plugin on Hermes (${{ github.event_name == 'schedule' && 'main' || inputs.hermes_ref || 'pinned' }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          path: hermes-gadget-sdk
          fetch-depth: 0
      - name: Changed areas
        # A pull request that can't change what the plugin does on Hermes passes here without
        # running the tests: this job is a required check, so it reports instead of being skipped.
        id: areas
        working-directory: hermes-gadget-sdk
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          run=true
          if [ -n "$BASE" ]; then
            git diff --name-only "$BASE...HEAD" | tee /dev/stderr | grep -qE \
              '^(plugin/|python/|tests/|firmware/(core|sim)/|firmware/CMakeLists\.txt$|pyproject\.toml$|\.github/workflows/hermes\.yml$)' || run=false
          fi
          echo "run=$run" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        if: steps.areas.outputs.run == 'true'
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ github.event_name == 'schedule' && 'main' || inputs.hermes_ref || env.HERMES_REF }}
          path: hermes-agent
      - name: Show the Hermes commit under test
        if: steps.areas.outputs.run == 'true'
        working-directory: hermes-agent
        run: git log -1 --format='Hermes Agent %H (%cs) %s'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        if: steps.areas.outputs.run == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: hermes-agent/uv.lock
      - name: Install Hermes Agent
        if: steps.areas.outputs.run == 'true'
        working-directory: hermes-agent
        run: uv sync --locked --python 3.14 --group dev
      - name: Add the SDK to the Hermes environment
        if: steps.areas.outputs.run == 'true'
        run: uv pip install --python hermes-agent/.venv/bin/python -e "./hermes-gadget-sdk[dev]"
      - name: Build the simulator library
        if: steps.areas.outputs.run == 'true'
        working-directory: hermes-gadget-sdk
        run: ../hermes-agent/.venv/bin/hermes-gadget build-sim
      - name: Test
        # The tests find the Hermes checkout beside this one (HERMES_AGENT_DIR defaults to
        # ../hermes-agent) and the end-to-end test runs the gateway from its .venv.
        if: steps.areas.outputs.run == 'true'
        working-directory: hermes-gadget-sdk
        env:
          HERMES_GADGET_E2E: "1"
        # In parallel; a test that fails is run again on its own, since a busy runner can make a
        # wait time out. A test that fails twice fails the job.
        run: |
          ../hermes-agent/.venv/bin/python -m pytest -q -rs -n auto --durations=25 ||
            ../hermes-agent/.venv/bin/python -m pytest -q -rs --last-failed --last-failed-no-failures none
