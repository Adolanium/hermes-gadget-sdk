name: Release

# Pushing a tag vX.Y.Z builds every board in platformio.ini and publishes the images,
# checksums and installer manifest as a GitHub release. PROJECT_VER in
# firmware/esp32/CMakeLists.txt must match the tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish again, e.g. v0.1.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('firmware/esp32/platformio.ini', 'firmware/esp32/main/idf_component.yml') }}
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build every board
        working-directory: firmware/esp32
        run: pio run
      - name: Package
        working-directory: firmware/esp32
        run: python tools/package_release.py --all --out dist --expect-version "${TAG#v}" --notes "$RUNNER_TEMP/notes.md"
      - name: Publish
        working-directory: firmware/esp32
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Hermes Gadget ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md"
          fi
